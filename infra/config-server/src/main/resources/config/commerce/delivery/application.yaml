server:
  port: 0

spring:
  application:
    name: delivery

  datasource:
    driverClassName: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5432/commerce?currentSchema=delivery"
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  sql:
    init:
      mode: always

delivery:
  base_cost: 5.0
  warehouse_address_1_ratio: 1
  warehouse_address_2_ratio: 2
  fragile_ratio: 0.2
  weight_ratio: 0.3
  volume_ratio: 0.2
  delivery_address_ratio: 0.2
